<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <!--
    RAVEN — Full Horizontal Brand Lockup
    Includes Shield Emblem + High-Precision Wordmark
  -->
  <defs>
    <linearGradient id="lockup-shield-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3469"/>
      <stop offset="100%" stop-color="#041E49"/>
    </linearGradient>
    <linearGradient id="lockup-shield-border" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lockup-beak" x1="36" y1="14" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="lockup-crown" x1="26" y1="14" x2="44" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="lockup-wing" x1="8" y1="14" x2="30" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#528FF0"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="lockup-base" x1="18" y1="32" x2="36" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F2854"/>
    </linearGradient>
  </defs>

  <!-- === 1. SHIELD EMBLEM (Left) === -->
  <g transform="translate(0, 0)">
    <path d="M 32 4 L 56 12 V 34 C 56 48, 45 56, 32 60 C 19 56, 8 48, 8 34 V 12 Z" 
          fill="url(#lockup-shield-bg)" 
          stroke="url(#lockup-shield-border)" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <g transform="translate(0.5, 2) scale(0.92)" transform-origin="32 32">
      <polygon points="10,24.5 25,14.5 29,33.5 14,49 8,36" fill="url(#lockup-wing)"/>
      <polygon points="26.5,14 43.5,14 35.5,31 29.5,33" fill="url(#lockup-crown)"/>
      <polygon points="44.5,14.5 59.5,26 36.5,31.8" fill="url(#lockup-beak)"/>
      <polygon points="29.8,35.5 35.5,33.5 28,46.5 17.5,46.5" fill="url(#lockup-base)"/>
      <circle cx="34.8" cy="22" r="2.8" fill="#041E49"/>
      <circle cx="34.8" cy="22" r="1.4" fill="#38BDF8"/>
    </g>
  </g>

  <!-- === 2. WORDMARK (Right) === -->
  <text x="76" y="40" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="3" 
        fill="#FFFFFF">RAVEN</text>
</svg>
