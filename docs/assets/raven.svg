<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    RAVEN — Risk Analysis & Verification for Evidence Navigation
    Master Brand Emblem: The Precision Aegis (Shield Edition)
    Features:
      - 0.75px Precision Prism Gap Lines
      - Optically Balanced Centroid Weight
      - 4 Distinct Pipeline Facets: Ingest • Verify • Resolve • Audit
      - Pulse-Ready Cyan Truth Lens
  -->
  <defs>
    <!-- Shield Container Gradients -->
    <linearGradient id="raven-shield-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3469"/>
      <stop offset="100%" stop-color="#041E49"/>
    </linearGradient>
    <linearGradient id="raven-shield-border" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Corvid Facet Gradients -->
    <linearGradient id="raven-beak-d" x1="36" y1="14" x2="60" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="raven-crown-d" x1="26" y1="14" x2="44" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="raven-wing-d" x1="8" y1="14" x2="30" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#528FF0"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="raven-base-d" x1="18" y1="32" x2="36" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F2854"/>
    </linearGradient>
  </defs>

  <!-- 1. Shield Base Container -->
  <path d="M 32 4 L 56 12 V 34 C 56 48, 45 56, 32 60 C 19 56, 8 48, 8 34 V 12 Z" 
        fill="url(#raven-shield-bg)" 
        stroke="url(#raven-shield-border)" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- 2. Precision-Gapped Aegis Corvid (Optically Centered) -->
  <g class="raven-corvid-group" transform="translate(0.5, 2) scale(0.92)" transform-origin="32 32">
    <!-- Facet 1: Wing Shield (Evidence Ingestion) -->
    <polygon points="10,24.5 25,14.5 29,33.5 14,49 8,36" fill="url(#raven-wing-d)"/>

    <!-- Facet 2: Crown & Brow (Forensic Logic) -->
    <polygon points="26.5,14 43.5,14 35.5,31 29.5,33" fill="url(#raven-crown-d)"/>

    <!-- Facet 3: Beak Chevron (Dispute Resolution) -->
    <polygon points="44.5,14.5 59.5,26 36.5,31.8" fill="url(#raven-beak-d)"/>

    <!-- Facet 4: Base Hackles (Tamper-Proof Audit) -->
    <polygon points="29.8,35.5 35.5,33.5 28,46.5 17.5,46.5" fill="url(#raven-base-d)"/>

    <!-- Facet 5: Verification Lens (Eye of Truth) -->
    <circle cx="34.8" cy="22" r="2.8" fill="#041E49"/>
    <circle class="raven-eye-dot" cx="34.8" cy="22" r="1.4" fill="#38BDF8"/>
  </g>
</svg>
